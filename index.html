<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookVerse POS — Kasir Toko Buku</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface2: #18181f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f5;
  --muted: #6b6b80;
  --accent: #6366f1;
  --accent2: #818cf8;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --cyan: #06b6d4;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'Space Grotesk', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--text);}
body{display:flex;flex-direction:column;min-height:100vh;}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.25rem;height:50px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.topbar-left{display:flex;align-items:center;gap:0.75rem;}
.logo{font-weight:700;font-size:1rem;letter-spacing:-0.5px;}
.logo span{color:var(--accent2);}
.cashier-badge{font-size:0.68rem;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);color:var(--accent2);padding:2px 9px;border-radius:20px;}
.topbar-right{display:flex;align-items:center;gap:1rem;}
.clock-time{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--accent2);letter-spacing:1px;}
.clock-date{font-size:0.7rem;color:var(--muted);}

/* SINGLE PANEL WRAPPER */
.pos-wrapper{
  flex:1;display:flex;flex-direction:column;
  max-width:900px;margin:0 auto;width:100%;
  padding:1rem;gap:1rem;
  overflow-y:auto;
}

/* SUMMARY CARDS */
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;}
.sum-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:0.7rem 1rem;position:relative;overflow:hidden;
}
.sum-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;}
.sum-card.c-blue::before{background:var(--accent2);}
.sum-card.c-green::before{background:var(--green);}
.sum-card.c-amber::before{background:var(--amber);}
.sum-card .s-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px;}
.sum-card .s-val{font-family:var(--mono);font-size:1rem;font-weight:700;}

/* KATEGORI TABS */
.cat-tabs{display:flex;gap:0.4rem;flex-wrap:wrap;}
.cat-tab{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:0.35rem 0.9rem;font-size:0.8rem;font-weight:500;color:var(--muted);
  cursor:pointer;transition:all 0.15s;
}
.cat-tab:hover{color:var(--text);border-color:var(--border2);}
.cat-tab.active{background:rgba(99,102,241,0.15);border-color:rgba(99,102,241,0.4);color:var(--accent2);}

/* SEARCH */
.search-row{display:flex;gap:0.5rem;}
.search-input{
  flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:0.6rem 1rem;color:var(--text);font-family:var(--sans);font-size:0.9rem;outline:none;
}
.search-input:focus{border-color:rgba(99,102,241,0.5);}
.search-input::placeholder{color:var(--muted);}

/* PRODUCT GRID */
.product-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0.6rem;
}
.prod-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:0.85rem;cursor:pointer;transition:all 0.15s;position:relative;
  display:flex;flex-direction:column;gap:0.3rem;
}
.prod-card:hover{border-color:rgba(99,102,241,0.4);background:var(--surface2);transform:translateY(-1px);}
.prod-card:active{transform:scale(0.97);}
.prod-icon{font-size:1.6rem;line-height:1;}
.prod-name{font-size:0.78rem;font-weight:600;line-height:1.3;color:var(--text);}
.prod-price{font-family:var(--mono);font-size:0.75rem;color:var(--green);font-weight:600;}
.prod-cat-tag{font-size:0.65rem;color:var(--muted);background:var(--surface2);padding:1px 5px;border-radius:4px;width:fit-content;}
.qty-badge{
  position:absolute;top:5px;right:5px;
  background:var(--accent);color:#fff;font-size:0.65rem;font-weight:700;
  width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;
}
.prod-card.in-cart .qty-badge{display:flex;}
.empty-products{grid-column:1/-1;text-align:center;padding:2rem;color:var(--muted);font-size:0.9rem;}

/* DIVIDER */
.section-label{font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:0.1rem;}

/* KERANJANG */
.cart-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;border-bottom:1px solid var(--border);}
.cart-head-title{font-weight:700;font-size:0.9rem;}
.btn-clear{background:none;border:1px solid rgba(239,68,68,0.3);color:var(--red);font-size:0.72rem;padding:3px 9px;border-radius:6px;cursor:pointer;font-family:var(--sans);}
.btn-clear:hover{background:rgba(239,68,68,0.1);}

.cart-empty-state{text-align:center;color:var(--muted);padding:1.5rem;font-size:0.85rem;}

.cart-item{
  display:flex;align-items:center;gap:0.5rem;padding:0.6rem 1rem;
  border-bottom:1px solid var(--border);
}
.cart-item:last-of-type{border-bottom:none;}
.ci-icon{font-size:1.2rem;flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-price{font-size:0.72rem;color:var(--muted);font-family:var(--mono);}
.ci-right{display:flex;align-items:center;gap:0.4rem;flex-shrink:0;}
.ci-subtotal{font-family:var(--mono);font-size:0.82rem;color:var(--green);font-weight:600;min-width:70px;text-align:right;}
.qty-ctrl{display:flex;align-items:center;gap:3px;}
.qty-btn{width:22px;height:22px;border-radius:5px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-btn:hover{border-color:var(--accent);color:var(--accent2);}
.qty-num{font-family:var(--mono);font-size:0.8rem;min-width:18px;text-align:center;}
.btn-rm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.7rem;padding:2px;}
.btn-rm:hover{color:var(--red);}

/* BAYAR SECTION */
.bayar-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:start;}

.totals-box{display:flex;flex-direction:column;gap:0.4rem;}
.tot-row{display:flex;justify-content:space-between;font-size:0.85rem;}
.tot-row .lbl{color:var(--muted);}
.tot-row.big{font-size:1.1rem;font-weight:700;padding-top:0.4rem;border-top:1px solid var(--border);margin-top:0.2rem;}
.tot-row.big .val{font-family:var(--mono);color:var(--green);}

.kembalian-box{
  background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);
  border-radius:8px;padding:0.5rem 0.75rem;display:flex;justify-content:space-between;font-size:0.85rem;margin-top:0.5rem;
}
.kembalian-box .val{font-family:var(--mono);font-weight:700;color:var(--green);}
.kembalian-box.kurang{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.2);}
.kembalian-box.kurang .val{color:var(--red);}

.numpad-wrap{display:flex;flex-direction:column;gap:0.4rem;}
.bayar-input-row{display:flex;gap:0.5rem;align-items:center;}
.bayar-label{font-size:0.75rem;color:var(--muted);white-space:nowrap;}
.bayar-input{
  flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  padding:0.5rem 0.75rem;color:var(--text);font-family:var(--mono);font-size:0.95rem;outline:none;text-align:right;
}
.bayar-input:focus{border-color:var(--accent);}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:0.3rem;}
.np-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  padding:0.5rem;font-size:0.88rem;font-family:var(--mono);color:var(--text);cursor:pointer;transition:all 0.1s;
}
.np-btn:hover{background:rgba(99,102,241,0.15);border-color:rgba(99,102,241,0.3);}
.np-btn:active{transform:scale(0.94);}
.np-btn.del{color:var(--amber);}
.np-btn.clr{color:var(--red);}
.np-btn.wide{grid-column:span 3;font-size:0.76rem;color:var(--cyan);}

.btn-bayar{
  width:100%;padding:0.85rem;border-radius:10px;border:none;
  background:linear-gradient(135deg,#6366f1,#818cf8);
  color:#fff;font-family:var(--sans);font-weight:700;font-size:1rem;
  cursor:pointer;transition:all 0.2s;margin-top:0.25rem;
}
.btn-bayar:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-bayar:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;transform:none;filter:none;}

/* MODAL STRUK */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.modal-overlay.active{display:flex;}
.struk-wrap{background:#fff;color:#111;width:320px;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.6);}
.struk-body{padding:1.5rem;font-family:'Courier New',monospace;font-size:12.5px;line-height:1.7;}
.struk-head{text-align:center;border-bottom:2px dashed #ccc;padding-bottom:0.75rem;margin-bottom:0.75rem;}
.struk-head h2{font-size:15px;font-weight:700;letter-spacing:1px;}
.struk-head p{font-size:10.5px;color:#666;}
.s-row{display:flex;justify-content:space-between;gap:0.5rem;}
.s-row.bold{font-weight:700;}
.s-divider{border:none;border-top:1px dashed #ccc;margin:0.4rem 0;}
.s-footer{text-align:center;margin-top:0.6rem;font-size:10.5px;color:#777;border-top:2px dashed #ccc;padding-top:0.5rem;}
.struk-actions{display:flex;gap:0.5rem;padding:1rem;background:#f5f5f5;border-top:1px solid #e5e5e5;}
.struk-actions button{flex:1;padding:0.65rem;border-radius:8px;font-weight:700;font-size:0.9rem;cursor:pointer;border:none;font-family:var(--sans);}
.btn-print-struk{background:#6366f1;color:#fff;}
.btn-new-trans{background:#e5e7eb;color:#374151;}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(60px);opacity:0;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:0.6rem 1.2rem;font-size:0.85rem;z-index:300;transition:all 0.3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

@media print{
  body *{visibility:hidden!important;}
  .struk-body,.struk-body *{visibility:visible!important;}
  .struk-body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">Book<span>Verse</span> POS</div>
    <div class="cashier-badge">KASIR</div>
  </div>
  <div class="topbar-right">
    <div style="text-align:right;">
      <div class="clock-time" id="clockTime">00:00:00</div>
      <div class="clock-date" id="clockDate">—</div>
    </div>
  </div>
</div>

<!-- SINGLE PANEL -->
<div class="pos-wrapper">

  <!-- SUMMARY CARDS -->
  <div class="summary-row">
    <div class="sum-card c-blue">
      <div class="s-label">Item di Keranjang</div>
      <div class="s-val" id="sumItems">0 item</div>
    </div>
    <div class="sum-card c-green">
      <div class="s-label">Total Belanja</div>
      <div class="s-val" id="sumTotal" style="color:var(--green);">Rp 0</div>
    </div>
    <div class="sum-card c-amber">
      <div class="s-label">No. Transaksi</div>
      <div class="s-val" id="sumNoTrans" style="color:var(--amber);">BV-0001</div>
    </div>
  </div>

  <!-- KATEGORI -->
  <div>
    <div class="section-label">Kategori Barang</div>
    <div class="cat-tabs" id="catTabs"></div>
  </div>

  <!-- SEARCH + PRODUK -->
  <div>
    <div class="search-row" style="margin-bottom:0.6rem;">
      <input type="text" class="search-input" id="searchProd" placeholder="🔍  Cari nama barang...">
    </div>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- KERANJANG -->
  <div>
    <div class="section-label">Keranjang Belanja</div>
    <div class="cart-box">
      <div class="cart-head">
        <span class="cart-head-title">🛒 Item Dipilih</span>
        <button class="btn-clear" onclick="clearCart()">Kosongkan</button>
      </div>
      <div id="cartBody">
        <div class="cart-empty-state" id="cartEmpty">Belum ada item — klik produk di atas untuk menambahkan.</div>
      </div>
    </div>
  </div>

  <!-- BAYAR -->
  <div>
    <div class="section-label">Pembayaran</div>
    <div class="bayar-grid">
      <!-- Kiri: ringkasan total -->
      <div>
        <div class="totals-box">
          <div class="tot-row"><span class="lbl">Subtotal</span><span class="val" id="totSubtotal">Rp 0</span></div>
          <div class="tot-row"><span class="lbl">Diskon</span><span class="val" style="color:var(--red);">— Rp 0</span></div>
          <div class="tot-row big"><span>TOTAL</span><span class="val" id="totTotal">Rp 0</span></div>
        </div>
        <div class="kembalian-box" id="kembalianBox">
          <span>Kembalian</span>
          <span class="val" id="kembalianVal">Rp 0</span>
        </div>
        <button class="btn-bayar" id="btnBayar" onclick="prosesBayar()" disabled style="margin-top:0.75rem;">
          💳 BAYAR SEKARANG
        </button>
      </div>

      <!-- Kanan: numpad -->
      <div class="numpad-wrap">
        <div class="bayar-input-row">
          <span class="bayar-label">Dibayar (Rp)</span>
          <input type="text" class="bayar-input" id="bayarInput" value="0" readonly>
        </div>
        <div class="numpad">
          <button class="np-btn" onclick="npInput('7')">7</button>
          <button class="np-btn" onclick="npInput('8')">8</button>
          <button class="np-btn" onclick="npInput('9')">9</button>
          <button class="np-btn" onclick="npInput('4')">4</button>
          <button class="np-btn" onclick="npInput('5')">5</button>
          <button class="np-btn" onclick="npInput('6')">6</button>
          <button class="np-btn" onclick="npInput('1')">1</button>
          <button class="np-btn" onclick="npInput('2')">2</button>
          <button class="np-btn" onclick="npInput('3')">3</button>
          <button class="np-btn del" onclick="npDel()">⌫</button>
          <button class="np-btn" onclick="npInput('0')">0</button>
          <button class="np-btn clr" onclick="npClear()">C</button>
          <button class="np-btn wide" onclick="bayarPas()">💵 Uang Pas</button>
          <button class="np-btn wide" onclick="bulatkan(50000)">+ Rp 50.000</button>
          <button class="np-btn wide" onclick="bulatkan(100000)">+ Rp 100.000</button>
        </div>
      </div>
    </div>
  </div>

  <div style="height:1rem;"></div>
</div>

<!-- MODAL STRUK -->
<div class="modal-overlay" id="modalStruk">
  <div class="struk-wrap">
    <div class="struk-body" id="strukBody"></div>
    <div class="struk-actions">
      <button class="btn-print-struk" onclick="window.print()">🖨️ Print</button>
      <button class="btn-new-trans" onclick="transaksiBaruSetelahBayar()">✚ Baru</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const products = [
  {id:'c1', name:'Pulpen Pilot G2',         price:8000,  cat:'Alat Tulis', icon:'🖊️'},
  {id:'c2', name:'Pensil 2B Faber Castell', price:5000,  cat:'Alat Tulis', icon:'✏️'},
  {id:'c3', name:'Spidol Snowman',          price:12000, cat:'Alat Tulis', icon:'🖍️'},
  {id:'c4', name:'Stabilo Boss',            price:9000,  cat:'Alat Tulis', icon:'🌟'},
  {id:'c5', name:'Tipe-X Joyko',           price:7000,  cat:'Alat Tulis', icon:'🔳'},
  {id:'c6', name:'Penggaris 30cm',          price:6000,  cat:'Alat Tulis', icon:'📏'},
  {id:'c7', name:'Gunting Joyko',           price:10000, cat:'Alat Tulis', icon:'✂️'},
  {id:'c8', name:'Lem Kertas UHU',         price:8500,  cat:'Alat Tulis', icon:'🧴'},
  {id:'c9', name:'Staples Max HD-10',      price:25000, cat:'Alat Tulis', icon:'📎'},
  {id:'c10',name:'Isi Staples (kotak)',    price:5000,  cat:'Alat Tulis', icon:'📌'},
  {id:'b1', name:'Novel Terjemahan',       price:85000, cat:'Buku', icon:'📖'},
  {id:'b2', name:'Komik Manga',            price:35000, cat:'Buku', icon:'📚'},
  {id:'b3', name:'Buku Pelajaran SMA',     price:65000, cat:'Buku', icon:'📘'},
  {id:'b4', name:'Ensiklopedia Sains',     price:150000,cat:'Buku', icon:'🔬'},
  {id:'b5', name:'Buku Anak Bergambar',    price:45000, cat:'Buku', icon:'🖼️'},
  {id:'b6', name:'Majalah Bobo',           price:25000, cat:'Buku', icon:'📰'},
  {id:'b7', name:'Buku Resep Masakan',     price:75000, cat:'Buku', icon:'🍳'},
  {id:'b8', name:'Kamus Bahasa Inggris',   price:95000, cat:'Buku', icon:'📒'},
  {id:'k1', name:'Buku Tulis (1 lusin)',   price:36000, cat:'Kantor', icon:'📓'},
  {id:'k2', name:'Map Plastik Bening',     price:5000,  cat:'Kantor', icon:'🗂️'},
  {id:'k3', name:'Kertas HVS A4 (rim)',    price:55000, cat:'Kantor', icon:'📄'},
  {id:'k4', name:'Amplop Coklat (pak)',    price:12000, cat:'Kantor', icon:'✉️'},
  {id:'k5', name:'Sticky Note 3M',         price:18000, cat:'Kantor', icon:'🗒️'},
  {id:'k6', name:'Binder A5',              price:30000, cat:'Kantor', icon:'📋'},
  {id:'k7', name:'Kalkulator Casio',       price:65000, cat:'Kantor', icon:'🧮'},
  {id:'a1', name:'Tas Ransel Sekolah',     price:185000,cat:'Aksesoris', icon:'🎒'},
  {id:'a2', name:'Tempat Pensil Kotak',    price:22000, cat:'Aksesoris', icon:'🗃️'},
  {id:'a3', name:'Bookmark Magnet',        price:15000, cat:'Aksesoris', icon:'🔖'},
  {id:'a4', name:'Cover Buku Plastik',     price:8000,  cat:'Aksesoris', icon:'🛡️'},
  {id:'a5', name:'Rautan Pensil Lipat',    price:7000,  cat:'Aksesoris', icon:'🔧'},
];

const categories = ['Semua', ...new Set(products.map(p=>p.cat))];
let activeCat = 'Semua';
let cart = [];
let bayarVal = 0;
let noTrans = 1;

// JAM
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULANFULL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function pad(n){return String(n).padStart(2,'0');}
function updateClock(){
  const now=new Date();
  document.getElementById('clockTime').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('clockDate').textContent=`${HARI[now.getDay()]}, ${now.getDate()} ${BULAN[now.getMonth()]} ${now.getFullYear()}`;
}
updateClock(); setInterval(updateClock,1000);
function getTimestamp(){const n=new Date();return `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;}
function getDateFull(){const n=new Date();return `${n.getDate()} ${BULANFULL[n.getMonth()]} ${n.getFullYear()}`;}

function rp(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(n);}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

// KATEGORI TABS
function renderCatTabs(){
  const el=document.getElementById('catTabs');
  el.innerHTML='';
  categories.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-tab'+(cat===activeCat?' active':'');
    const icons={Semua:'🏪','Alat Tulis':'✏️',Buku:'📚',Kantor:'🗂️',Aksesoris:'🎒'};
    const count=cat==='Semua'?products.length:products.filter(p=>p.cat===cat).length;
    btn.textContent=`${icons[cat]||''} ${cat} (${count})`;
    btn.onclick=()=>{activeCat=cat; renderCatTabs(); renderProducts();};
    el.appendChild(btn);
  });
}

// PRODUK
function renderProducts(){
  const search=document.getElementById('searchProd').value.toLowerCase();
  const grid=document.getElementById('productGrid');
  const filtered=products.filter(p=>(activeCat==='Semua'||p.cat===activeCat)&&p.name.toLowerCase().includes(search));
  grid.innerHTML='';
  if(!filtered.length){grid.innerHTML='<div class="empty-products">🔍 Barang tidak ditemukan</div>';return;}
  filtered.forEach(p=>{
    const inCart=cart.find(c=>c.id===p.id);
    const card=document.createElement('div');
    card.className='prod-card'+(inCart?' in-cart':'');
    card.id='pc-'+p.id;
    card.innerHTML=`
      <div class="qty-badge" id="qb-${p.id}">${inCart?inCart.qty:''}</div>
      <div class="prod-icon">${p.icon}</div>
      <div class="prod-name">${p.name}</div>
      <div class="prod-price">${rp(p.price)}</div>
      <div class="prod-cat-tag">${p.cat}</div>`;
    card.onclick=()=>addToCart(p);
    grid.appendChild(card);
        });
}

// KERANJANG
function addToCart(p){
  const ex=cart.find(c=>c.id===p.id);
  if(ex){ex.qty++;}else{cart.push({id:p.id,name:p.name,price:p.price,icon:p.icon,qty:1});}
  toast(`✅ ${p.name}`);
  renderProducts(); renderCart(); updateSummary();
}
function changeQty(id,d){
  const item=cart.find(c=>c.id===id);
  if(!item)return;
  item.qty+=d;
  if(item.qty<=0) cart=cart.filter(c=>c.id!==id);
  renderProducts(); renderCart(); updateSummary();
}
function removeItem(id){
  cart=cart.filter(c=>c.id!==id);
  renderProducts(); renderCart(); updateSummary();
  toast('🗑️ Dihapus');
}
function clearCart(){
  cart=[]; bayarVal=0;
    document.getElementById('bayarInput').value='0';
  renderProducts(); renderCart(); updateSummary();
}
function renderCart(){
  const body=document.getElementById('cartBody');
  const empty=document.getElementById('cartEmpty');
  body.innerHTML='';
  if(!cart.length){body.appendChild(empty);empty.style.display='block';return;}
  cart.forEach(item=>{
    const row=document.createElement('div');
    row.className='cart-item';
    row.innerHTML=`
      <div class="ci-icon">${item.icon}</div>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">${rp(item.price)}/pcs</div>
      </div>
      <div class="ci-right">
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
          <button class="btn-rm" onclick="removeItem('${item.id}')">✕</button>
        </div>
        <div class="ci-subtotal">${rp(item.price*item.qty)}</div>
      </div>`;
    body.appendChild(row);
  });
}

function getTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}

function updateSummary(){
  const total=getTotal();
  const totalItems=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('sumItems').textContent=totalItems+' item';
  document.getElementById('sumTotal').textContent=rp(total);
  document.getElementById('sumNoTrans').textContent='BV-'+String(noTrans).padStart(4,'0');
  document.getElementById('totSubtotal').textContent=rp(total);
  document.getElementById('totTotal').textContent=rp(total);
  updateKembalian();
}

function updateKembalian(){
  const total=getTotal(), kem=bayarVal-total;
  const box=document.getElementById('kembalianBox');
  document.getElementById('kembalianVal').textContent=kem>=0?rp(kem):'Kurang '+rp(Math.abs(kem));
  box.className='kembalian-box'+(kem<0&&bayarVal>0?' kurang':'');
  document.getElementById('btnBayar').disabled = cart.length===0 || bayarVal<total;
}

// NUMPAD
function npInput(d){
  let cur=document.getElementById('bayarInput').value.replace(/\D/g,'');
  if(cur==='0')cur='';
  cur+=d; bayarVal=parseInt(cur)||0;
  document.getElementById('bayarInput').value=bayarVal.toLocaleString('id-ID');
  updateKembalian();
}
function npDel(){
  let cur=document.getElementById('bayarInput').value.replace(/\D/g,'');
  cur=cur.slice(0,-1)||'0'; bayarVal=parseInt(cur)||0;
  document.getElementById('bayarInput').value=bayarVal.toLocaleString('id-ID');
  updateKembalian();
}
function npClear(){
  bayarVal=0; document.getElementById('bayarInput').value='0'; updateKembalian();
}
function bayarPas(){
  bayarVal=getTotal();
  document.getElementById('bayarInput').value=bayarVal.toLocaleString('id-ID');
  updateKembalian();
}
function bulatkan(nominal){
  const total=getTotal();
  bayarVal=Math.ceil(total/nominal)*nominal;
  document.getElementById('bayarInput').value=bayarVal.toLocaleString('id-ID');
  updateKembalian();
}

// PROSES BAYAR
function prosesBayar(){
  const total=getTotal();
  if(!cart.length||bayarVal<total)return;
  const kem=bayarVal-total;
  const tgl=getDateFull(), jam=getTimestamp();
  const kodeNo='BV-'+String(noTrans).padStart(4,'0');
  noTrans++;

  let itemRows='';
  cart.forEach(item=>{
    const nm=item.name.length>20?item.name.substring(0,18)+'…':item.name;
    itemRows+=`
      <div class="s-row" style="font-size:11.5px;"><span style="flex:1;">${item.icon} ${nm}</span></div>
      <div class="s-row" style="font-size:11px;color:#555;padding-left:1rem;">
        <span>${item.qty} × ${rp(item.price)}</span><span>${rp(item.price*item.qty)}</span>
      </div>`;
  });

  document.getElementById('strukBody').innerHTML=`
    <div class="struk-head">
      <h2>📚 BOOKVERSE POS</h2>
      <p>Kasir Toko Buku</p>
      <p style="margin-top:3px;">${tgl} | ${jam}</p>
      <p><strong>${kodeNo}</strong></p>
    </div>
    <div style="font-size:10px;color:#777;margin-bottom:4px;">BELANJA:</div>
    ${itemRows}
    <hr class="s-divider">
    <div class="s-row"><span>Total</span><span style="color:#16a34a;font-weight:700;">${rp(total)}</span></div>
    <div class="s-row"><span>Dibayar</span><span>${rp(bayarVal)}</span></div>
    <div class="s-row bold"><span>Kembalian</span><span style="color:#16a34a;">${rp(kem)}</span></div>
    <div class="s-footer">Terima kasih sudah berbelanja!<br>Selamat membaca 📖</div>`;

  document.getElementById('modalStruk').classList.add('active');
}

function transaksiBaruSetelahBayar(){
  document.getElementById('modalStruk').classList.remove('active');
  clearCart(); updateSummary();
  toast('✨ Siap transaksi baru!');
}

document.getElementById('searchProd').addEventListener('input', renderProducts);

renderCatTabs();
renderProducts();
renderCart();
updateSummary();
</script>
</body>
</html>
